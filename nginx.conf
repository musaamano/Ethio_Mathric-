# ============================================================
# Ethio Matric Academy — Nginx Configuration
# ============================================================
# Place this in /etc/nginx/sites-available/ethiomatric
# Then: ln -s /etc/nginx/sites-available/ethiomatric /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name ethiomatric.com www.ethiomatric.com;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ethiomatric.com www.ethiomatric.com;

    # SSL certificates (use Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/ethiomatric.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ethiomatric.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options         "SAMEORIGIN"            always;
    add_header X-Content-Type-Options  "nosniff"               always;
    add_header X-XSS-Protection        "1; mode=block"         always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=()" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # ── Serve React frontend (static files) ──
    root /var/www/ethiomatric/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;  # SPA fallback
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Proxy API to Node.js backend ──
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       'upgrade';
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        client_max_body_size 20M;
    }

    # ── Serve uploaded files ──
    location /uploads/ {
        alias /var/www/ethiomatric/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }
}
