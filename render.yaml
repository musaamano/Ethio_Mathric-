services:
  # ── Backend API ──────────────────────────────────────────
  - type: web
    name: ethio-matric-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production

  # ── Frontend Static Site ─────────────────────────────────
  - type: static
    name: ethio-matric-academy
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # _redirects in dist/ handles SPA fallback: /* → /index.html 200
    # VITE_API_URL is baked at build time via frontend/.env.production
